<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Čišćenje apartmana</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f6f5; --fg: #17302b; --muted: #58706b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1917; --fg: #e5efed; --muted: #94aaa5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { margin: .25rem 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🧹 Čišćenje apartmana</h1>
  <p>Stranica se otvara preko osobnog linka koji ste dobili.</p>
  <p>Please open the personal link you received.</p>
</main>
</body>
</html>
