<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Apartmani · administracija</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f1ea; --card: #fff; --fg: #1d2a33; --muted: #5d6b75; --line: #e1d9cb; --input: #fbf9f5;
    --sea: #0b5d7a; --ok: #2a7d4f; --okbg: #e3f3e9; --warn: #b5541c; --warnbg: #fdeee2; --err: #b3261e; --errbg: #fbe9e7; --grey: #eceae4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a21; --card: #17252e; --fg: #e8eef2; --muted: #9aabb6; --line: #2a3b46; --input: #12202a;
      --sea: #4fb3cf; --ok: #6fd39a; --okbg: #163326; --warn: #f2a46b; --warnbg: #3a2416; --err: #ff8a80; --errbg: #3a1a18; --grey: #22323c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  header { background: var(--sea); color: #fff; }
  @media (prefers-color-scheme: dark) { header { background: #0b3f52; } }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; padding-bottom: 12px; }
  header b { font-size: 1.1rem; }
  header button { background: transparent; border: 1px solid rgba(255,255,255,.5); color: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  nav.tabs { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
  nav.tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 10px; cursor: pointer; color: var(--muted); font-weight: 600; }
  nav.tabs button.on { color: var(--sea); border-bottom-color: var(--sea); }
  main { padding: 16px 0 60px; }
  h2 { font-size: 1.2rem; margin: 18px 0 10px; }
  h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-top: 8px; }
  input, select, textarea { width: 100%; margin-top: 3px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--input); min-height: 40px; }
  textarea { min-height: 80px; resize: vertical; }
  input[type=checkbox] { width: auto; min-height: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0 12px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; padding: 8px 14px; background: var(--sea); color: #fff; font-weight: 600; cursor: pointer; min-height: 40px; text-decoration: none; }
  @media (prefers-color-scheme: dark) { .btn { color: #0f1a21; } }
  .btn.ghost { background: transparent; color: var(--sea); border: 1px solid var(--sea); }
  .btn.danger { background: transparent; color: var(--err); border: 1px solid var(--err); }
  .btn.ok { background: var(--ok); }
  .btn.sm { min-height: 32px; padding: 4px 10px; font-size: .85rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: .8rem; font-weight: 700; }
  .b-wait { background: var(--grey); color: var(--muted); }
  .b-todo { background: var(--warnbg); color: var(--warn); }
  .b-ok { background: var(--okbg); color: var(--ok); }
  .stay .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .stay .who { font-weight: 700; font-size: 1.05rem; }
  .gtable { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .gtable td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  .gtable td:first-child { color: var(--muted); width: 42%; font-size: .9rem; }
  .gtable td.copy { cursor: pointer; font-weight: 600; }
  .gtable td.copy:hover { color: var(--sea); }
  .gtable td.copy.done::after { content: " ✓"; color: var(--ok); }
  .guest { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .linkbox { word-break: break-all; background: var(--input); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-family: ui-monospace, monospace; font-size: .85rem; }
  table.list { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table.list th, table.list td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); font-size: .9rem; }
  table.list th { background: var(--grey); border-top: 0; }
  .scroll { overflow-x: auto; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 12px; margin-top: 10px; background: var(--bg); }
  .item .tools { display: flex; justify-content: flex-end; gap: 4px; }
  .item .tools button { background: none; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; padding: 2px 8px; }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .langs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .langs button.on { background: var(--sea); border-color: var(--sea); color: #fff; }
  .sticky-save { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; border-top: 1px solid var(--line); margin-top: 14px; display: flex; gap: 10px; align-items: center; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1d2a33; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .login { max-width: 340px; margin: 12vh auto; text-align: center; }
  .login input { text-align: center; font-size: 1.4rem; letter-spacing: .2em; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 40; }
  .modal .card { max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; }
  .hint { background: var(--warnbg); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: .9rem; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const LANGS = { hr: 'Hrvatski', en: 'English', de: 'Deutsch', it: 'Italiano' };
const SHARE_TEXT = {
  hr: 'Dobrodošli! Na ovom linku su sve informacije o apartmanu i Lošinju te prijava gostiju (molimo ispunite prije dolaska): ',
  en: 'Welcome! This link has all the information about the apartment and Lošinj, plus the guest registration (please fill it in before you arrive): ',
  de: 'Willkommen! Unter diesem Link finden Sie alle Infos zur Ferienwohnung und zu Lošinj sowie die Gästeanmeldung (bitte vor der Ankunft ausfüllen): ',
  it: 'Benvenuti! A questo link trovate tutte le informazioni sull\'appartamento e su Lošinj e la registrazione ospiti (compilatela prima dell\'arrivo): ',
};
const DOC = { passport: 'Putovnica', id: 'Osobna iskaznica', other: 'Ostalo' };
const SEX = { M: 'Muški', F: 'Ženski' };

let pin = sessionStorage.getItem('pin') || '';
let D = null, tab = sessionStorage.getItem('tab') || 'stays', editLang = 'hr', openStay = null, editStayId = null, dirty = false;
let year = new Date().getFullYear();
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Zagreb' });
const addDays = (day, n) => { const d = new Date(day + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const nights = (a, b) => Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 864e5);
const fmt = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) + '.' : '';
const fmtTs = ts => new Date(ts).toLocaleString('hr-HR', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
let countryName = c => c;
try { const dn = new Intl.DisplayNames(['hr'], { type: 'region' }); countryName = c => (c && dn.of(c)) || c; } catch {}
const linkFor = s => location.origin + '/g/' + s.token;
const aptName = id => (D.apartments.find(a => a.id === id) || {}).name || '?';

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

async function api(path, opts = {}) {
  const r = await fetch('/api/admin/' + path, {
    method: opts.method || 'GET',
    headers: { 'X-Admin-Pin': pin, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { pin = ''; sessionStorage.removeItem('pin'); showLogin('Pogrešan PIN.'); throw new Error('pin'); }
  if (r.status === 429) { showLogin('Previše pokušaja. Pričekajte 15 minuta.'); throw new Error('many'); }
  if (r.status === 503 && d.error === 'no_pin') { showLogin('PIN nije postavljen (ADMIN_PIN u Cloudflareu).'); throw new Error('nopin'); }
  if (!r.ok) { toast(d.error === 'invalid' ? 'Provjerite unesene podatke.' : 'Greška pri spremanju.'); throw new Error(d.error || 'err'); }
  return d;
}

function showLogin(msg = '') {
  app.innerHTML = `<div class="login card"><h3>🌊 Apartmani</h3><p class="muted">Upišite PIN</p>
    <form onsubmit="login(event)"><input type="password" id="pin" inputmode="numeric" autocomplete="current-password" autofocus>
    <div class="row" style="justify-content:center"><button class="btn">Prijava</button></div></form>
    <p style="color:var(--err)">${esc(msg)}</p></div>`;
}
async function login(e) {
  e.preventDefault();
  pin = document.getElementById('pin').value.trim();
  sessionStorage.setItem('pin', pin);
  await reload();
}
function logout() { pin = ''; sessionStorage.removeItem('pin'); showLogin(); }

async function reload() {
  try { D = await api('data'); } catch { return; }
  dirty = false;
  render();
}

function setTab(t) {
  if (dirty && !confirm('Imate nespremljene promjene. Odbaciti ih?')) return;
  tab = t; sessionStorage.setItem('tab', t); scrollTo(0, 0);
  if (dirty) reload(); else render();
}

function render() {
  const tabs = [['stays', '🗓 Boravci'], ['log', '📒 Evidencija'], ['apts', '🏠 Apartmani'], ['content', '📝 Sadržaj'], ['settings', '⚙️ Postavke']];
  let h = `<header><div class="wrap"><b>🌊 Apartmani</b><button onclick="logout()">Odjava</button></div></header>
    <nav class="tabs"><div class="wrap">${tabs.map(([k, v]) => `<button class="${tab === k ? 'on' : ''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div></nav>
    <main class="wrap">`;
  h += { stays: staysTab, log: logTab, apts: aptsTab, content: contentTab, settings: settingsTab }[tab]();
  h += '</main>';
  app.innerHTML = h;
}

// ---------- stays ----------
function stayState(s) {
  if (s.wiped) return ['b-ok', s.entered ? 'Upisano · podaci obrisani' : 'Podaci obrisani'];
  if (s.entered) return ['b-ok', '✓ Upisano u eVisitor'];
  if (s.guests) return ['b-todo', `Prijavljeno ${s.n_guests} – upiši u eVisitor`];
  return ['b-wait', 'Čeka prijavu gosta'];
}

function stayForm(s) {
  const t = today();
  s = s || { apt: D.apartments[0]?.id, surname: '', arrival: t, departure: addDays(t, 7), expected: 2, lang: 'de', note: '' };
  return `<div class="grid">
      <label>Apartman<select id="f-apt">${D.apartments.map(a => `<option value="${esc(a.id)}"${a.id === s.apt ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}</select></label>
      <label>Prezime / naziv rezervacije<input id="f-surname" value="${esc(s.surname)}" placeholder="npr. Müller"></label>
      <label>Dolazak<input type="date" id="f-arrival" value="${esc(s.arrival)}"></label>
      <label>Odlazak<input type="date" id="f-departure" value="${esc(s.departure)}"></label>
      <label>Broj gostiju<input type="number" id="f-expected" min="1" max="12" value="${esc(s.expected)}"></label>
      <label>Jezik gosta<select id="f-lang">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}"${k === s.lang ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
    </div>
    <label>Napomena (vidite samo vi)<input id="f-note" value="${esc(s.note)}" placeholder="npr. Booking, dolaze kasno"></label>`;
}
const readStayForm = () => ({
  apt: document.getElementById('f-apt').value, surname: document.getElementById('f-surname').value,
  arrival: document.getElementById('f-arrival').value, departure: document.getElementById('f-departure').value,
  expected: document.getElementById('f-expected').value, lang: document.getElementById('f-lang').value, note: document.getElementById('f-note').value,
});

function staysTab() {
  const t = today();
  const active = D.stays.filter(s => s.guests || addDays(s.departure, D.link_days_after) >= t)
    .sort((a, b) => a.arrival.localeCompare(b.arrival) || a.id - b.id);
  const todo = active.filter(s => s.guests && !s.entered).length;
  let h = `<h2>Novi boravak</h2><div class="card">${stayForm()}
    <div class="row"><button class="btn" onclick="createStay()">🔗 Napravi link za goste</button></div></div>`;
  h += `<h2>Trenutni i nadolazeći boravci ${todo ? `<span class="badge b-todo">${todo} za eVisitor</span>` : ''}</h2>`;
  if (!active.length) h += '<p class="muted">Nema boravaka. Napravite link iznad i pošaljite ga gostu.</p>';
  h += active.map(stayCard).join('');
  h += `<p class="muted small">Osobni podaci s putovnica brišu se automatski ${D.keep_days} dana nakon što ih gost pošalje. Link za goste vrijedi do ${D.link_days_after} dana nakon odlaska.</p>`;
  return h;
}

function stayCard(s) {
  const [cls, label] = stayState(s);
  const open = openStay === s.id;
  let h = `<div class="card stay"><div class="top">
      <div><div class="who">${esc(s.surnames || s.surname || '—')}</div>
      <div class="muted">${esc(aptName(s.apt))} · ${fmt(s.arrival)} – ${fmt(s.departure)} · ${nights(s.arrival, s.departure)} noći · ${s.n_guests || s.expected} os.${s.arrival_time ? ' · dolazak ~' + esc(s.arrival_time) : ''}</div>
      ${s.note ? `<div class="small">📝 ${esc(s.note)}</div>` : ''}</div>
      <span class="badge ${cls}">${label}</span></div>`;
  if (editStayId === s.id) {
    h += `<div style="margin-top:8px">${stayForm(s)}<div class="row"><button class="btn" onclick="saveStay(${s.id})">Spremi</button>
      <button class="btn ghost" onclick="editStayId=null;render()">Odustani</button></div></div></div>`;
    return h;
  }
  h += `<div class="row">
    <button class="btn sm ghost" onclick="shareStay(${s.id})">🔗 Link</button>
    ${s.guests ? `<button class="btn sm${open ? ' ghost' : ''}" onclick="toggleStay(${s.id})">${open ? 'Sakrij podatke' : '🛂 Podaci za eVisitor'}</button>` : ''}
    <button class="btn sm ghost" onclick="editStayId=${s.id};render()">Uredi</button>
  </div>`;
  if (open && s.guests) {
    h += `<p class="small muted">Dodirnite podatak da ga kopirate. Poslano ${fmtTs(s.submitted)}; automatsko brisanje ${fmtTs(s.wipe_at)}.</p>`;
    h += `<table class="gtable"><tr><td>Dolazak</td><td class="copy" onclick="cp(this)">${fmt(s.arrival)}</td></tr>
      <tr><td>Odlazak</td><td class="copy" onclick="cp(this)">${fmt(s.departure)}</td></tr>
      ${s.arrival_time ? `<tr><td>Vrijeme dolaska</td><td class="copy" onclick="cp(this)">${esc(s.arrival_time)}</td></tr>` : ''}</table>`;
    h += s.guests.map((g, i) => `<div class="guest"><b>Gost ${i + 1}</b><table class="gtable">
      ${[['Prezime', g.last], ['Ime', g.first], ['Spol', SEX[g.sex]], ['Datum rođenja', fmt(g.dob)], ['Država rođenja', countryName(g.birth_country)],
         ['Mjesto rođenja', g.birth_city], ['Državljanstvo', countryName(g.citizenship)], ['Država prebivališta', countryName(g.res_country)],
         ['Mjesto prebivališta', g.res_city], ['Vrsta isprave', DOC[g.doc_type]], ['Broj isprave', g.doc_number]]
        .filter(([, v]) => v).map(([k, v]) => `<tr><td>${k}</td><td class="copy" onclick="cp(this)">${esc(v)}</td></tr>`).join('')}
      </table></div>`).join('');
    h += `<div class="row">
      ${s.entered ? `<button class="btn sm ghost" onclick="entered(${s.id}, false)">Poništi „upisano"</button>`
                  : `<button class="btn sm ok" onclick="entered(${s.id}, true)">✓ Upisano u eVisitor</button>`}
      <button class="btn sm danger" onclick="wipe(${s.id})">Obriši podatke s putovnica sada</button></div>`;
  }
  h += `<div class="row"><button class="btn sm danger" onclick="delStay(${s.id})">Obriši boravak</button></div>`;
  return h + '</div>';
}

function toggleStay(id) { openStay = openStay === id ? null : id; render(); }
async function cp(td) {
  const text = td.textContent.replace(/ ✓$/, '');
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  td.classList.add('done');
}

async function createStay() {
  const st = readStayForm();
  if (!st.arrival || !st.departure || st.departure < st.arrival) return toast('Provjerite datume.');
  try {
    const r = await api('stays', { method: 'POST', body: st });
    await reload();
    shareStay(r.id);
  } catch {}
}
async function saveStay(id) {
  try { await api('stays/' + id, { method: 'POST', body: readStayForm() }); editStayId = null; await reload(); toast('Spremljeno'); } catch {}
}
async function entered(id, on) {
  if (on && !confirm('Označiti kao upisano u eVisitor? Gost više neće moći mijenjati prijavu.')) return;
  try { await api('stays/' + id + '/entered', { method: 'POST', body: { on } }); await reload(); } catch {}
}
async function wipe(id) {
  if (!confirm('Trajno obrisati podatke s putovnica za ovaj boravak? Ostaju samo prezime i datumi.')) return;
  try { await api('stays/' + id + '/wipe', { method: 'POST', body: {} }); openStay = null; await reload(); toast('Podaci obrisani'); } catch {}
}
async function delStay(id) {
  if (!confirm('Obrisati cijeli boravak, i iz evidencije? Link za goste prestaje raditi.')) return;
  try { await api('stays/' + id, { method: 'DELETE' }); await reload(); } catch {}
}

function shareStay(id) {
  const s = D.stays.find(x => x.id === id);
  if (!s) return;
  const link = linkFor(s);
  const text = (SHARE_TEXT[s.lang] || SHARE_TEXT.en) + link;
  const m = document.createElement('div');
  m.className = 'modal';
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.innerHTML = `<div class="card"><h3>🔗 Link za goste</h3>
    <p class="muted">${esc(s.surname || '')} · ${esc(aptName(s.apt))} · ${fmt(s.arrival)} – ${fmt(s.departure)}</p>
    <div class="linkbox">${esc(link)}</div>
    <label>Poruka za gosta (${LANGS[s.lang]})<textarea id="sharetext">${esc(text)}</textarea></label>
    <div class="row">
      <a class="btn" id="wa" target="_blank" rel="noopener">💬 WhatsApp</a>
      <a class="btn ghost" id="sms">✉️ SMS</a>
      <a class="btn ghost" id="mail">📧 E-mail</a>
      <button class="btn ghost" id="copy">📋 Kopiraj</button>
      ${navigator.share ? '<button class="btn ghost" id="native">📤 Podijeli</button>' : ''}
    </div>
    <div class="row"><a class="btn sm ghost" href="${esc(link)}" target="_blank" rel="noopener noreferrer">👁 Pogledaj kao gost</a>
      <button class="btn sm ghost" onclick="this.closest('.modal').remove()">Zatvori</button></div></div>`;
  document.body.appendChild(m);
  const ta = m.querySelector('#sharetext');
  const upd = () => {
    const v = ta.value;
    m.querySelector('#wa').href = 'https://wa.me/?text=' + encodeURIComponent(v);
    m.querySelector('#sms').href = 'sms:?&body=' + encodeURIComponent(v);
    m.querySelector('#mail').href = 'mailto:?subject=' + encodeURIComponent(aptName(s.apt)) + '&body=' + encodeURIComponent(v);
  };
  ta.oninput = upd; upd();
  m.querySelector('#copy').onclick = async () => { try { await navigator.clipboard.writeText(ta.value); toast('Kopirano'); } catch { ta.select(); document.execCommand('copy'); toast('Kopirano'); } };
  const nat = m.querySelector('#native');
  if (nat) nat.onclick = () => navigator.share({ text: ta.value }).catch(() => {});
}

// ---------- log (evidencija) ----------
function logTab() {
  const years = [...new Set(D.stays.map(s => +s.arrival.slice(0, 4)))].sort((a, b) => b - a);
  if (!years.includes(year)) years.unshift(year);
  const list = D.stays.filter(s => +s.arrival.slice(0, 4) === year).sort((a, b) => a.arrival.localeCompare(b.arrival));
  const totalNights = list.reduce((n, s) => n + nights(s.arrival, s.departure), 0);
  const totalGuests = list.reduce((n, s) => n + (s.n_guests || 0), 0);
  let h = `<h2>Evidencija boravaka</h2>
    <p class="muted">Nakon brisanja osobnih podataka ostaju samo prezime, datumi boravka, apartman i broj gostiju.</p>
    <div class="row"><select style="width:auto" onchange="year=+this.value;render()">${years.map(y => `<option${y === year ? ' selected' : ''}>${y}</option>`).join('')}</select>
    <button class="btn ghost" onclick="exportCsv()">⬇️ CSV</button>
    <span class="muted">${list.length} boravaka · ${totalNights} noći · ${totalGuests} prijavljenih gostiju</span></div>`;
  h += `<div class="scroll" style="margin-top:12px"><table class="list"><tr><th>Dolazak</th><th>Odlazak</th><th>Noći</th><th>Apartman</th><th>Prezime</th><th>Gostiju</th><th>eVisitor</th></tr>
    ${list.map(s => `<tr><td>${fmt(s.arrival)}</td><td>${fmt(s.departure)}</td><td>${nights(s.arrival, s.departure)}</td><td>${esc(aptName(s.apt))}</td>
      <td>${esc(s.surnames || s.surname)}</td><td>${s.n_guests || '–'}</td><td>${s.entered ? '✓' : s.guests ? '<span class="badge b-todo">čeka</span>' : '–'}</td></tr>`).join('')}
    </table></div>`;
  return h;
}
function exportCsv() {
  const list = D.stays.filter(s => +s.arrival.slice(0, 4) === year).sort((a, b) => a.arrival.localeCompare(b.arrival));
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Dolazak', 'Odlazak', 'Noći', 'Apartman', 'Prezime', 'Gostiju', 'Upisano u eVisitor']]
    .concat(list.map(s => [fmt(s.arrival), fmt(s.departure), nights(s.arrival, s.departure), aptName(s.apt), s.surnames || s.surname, s.n_guests || '', s.entered ? 'da' : 'ne']));
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `evidencija-${year}.csv`; a.click();
}

// ---------- editing helpers (apartments and content) ----------
// Inputs carry data-p = path inside D (e.g. "apartments.0.items.2.title"); data-ml marks a text
// kept per language, which is stored under the language chosen at the top.
function getPath(path) { return path.split('.').reduce((o, k) => o[k], D); }
function setPath(path, v) {
  const keys = path.split('.'), last = keys.pop();
  const o = keys.reduce((o, k) => o[k], D);
  o[last] = v;
}
function onEdit(e) {
  const el = e.target;
  if (!el.dataset.p) return;
  if (el.dataset.ml !== undefined) {
    const o = getPath(el.dataset.p) || {};
    o[editLang] = el.value;
    setPath(el.dataset.p, o);
  } else setPath(el.dataset.p, el.value);
  dirty = true;
}
const ml = (path, o, textarea, ph) => {
  const v = (o && o[editLang]) || '';
  const hint = (o && (o.hr || o.en)) || ph || '';
  return textarea
    ? `<textarea data-p="${path}" data-ml placeholder="${esc(hint)}">${esc(v)}</textarea>`
    : `<input data-p="${path}" data-ml value="${esc(v)}" placeholder="${esc(hint)}">`;
};
const plain = (path, v, ph = '') => `<input data-p="${path}" value="${esc(v)}" placeholder="${esc(ph)}">`;
function langBar() {
  return `<div class="card"><div class="muted small" style="margin-bottom:6px">Jezik teksta koji uređujete (gost vidi svoj jezik; ako prijevod nedostaje, vidi engleski pa hrvatski):</div>
    <div class="langs">${Object.entries(LANGS).map(([k, v]) => `<button class="${k === editLang ? 'on' : ''}" onclick="editLang='${k}';render()">${v}</button>`).join('')}</div></div>`;
}
function itemsEditor(path, items) {
  return items.map((it, i) => `<div class="item"><div class="tools">
      <button title="Gore" onclick="move('${path}',${i},-1)">↑</button><button title="Dolje" onclick="move('${path}',${i},1)">↓</button>
      <button title="Ukloni" onclick="removeAt('${path}',${i})">✕</button></div>
      <label>Naslov (${LANGS[editLang]})${ml(`${path}.${i}.title`, it.title)}</label>
      <label>Tekst (${LANGS[editLang]})${ml(`${path}.${i}.text`, it.text, true)}</label>
      <div class="grid"><label>Link (neobavezno)${plain(`${path}.${i}.link`, it.link, 'https://…')}</label>
      <label>Slika – URL (neobavezno)${plain(`${path}.${i}.img`, it.img, 'https://…')}</label></div>
    </div>`).join('') + `<div class="row"><button class="btn sm ghost" onclick="addItem('${path}')">＋ Dodaj stavku</button></div>`;
}
function move(path, i, d) {
  const a = getPath(path), j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; dirty = true; render();
}
function removeAt(path, i) {
  if (!confirm('Ukloniti?')) return;
  getPath(path).splice(i, 1); dirty = true; render();
}
function addItem(path) { getPath(path).push({ title: {}, text: {}, link: '', img: '' }); dirty = true; render(); }
const saveBar = fn => `<div class="sticky-save"><button class="btn" onclick="${fn}()">💾 Spremi</button><span class="muted small">Promjene gosti vide odmah nakon spremanja.</span></div>`;

// ---------- apartments ----------
function aptsTab() {
  let h = `<h2>Apartmani</h2>${langBar()}<div oninput="onEdit(event)">`;
  h += D.apartments.map((a, i) => `<div class="card"><div class="row" style="justify-content:space-between;margin:0"><h3>🏠 ${esc(a.name || 'Novi apartman')}</h3>
      ${D.apartments.length > 1 ? `<button class="btn sm danger" onclick="removeApt(${i})">Ukloni apartman</button>` : ''}</div>
      <div class="grid">
        <label>Naziv${plain(`apartments.${i}.name`, a.name, 'npr. Apartman More')}</label>
        <label>Adresa${plain(`apartments.${i}.address`, a.address)}</label>
        <label>Link na kartu (neobavezno)${plain(`apartments.${i}.map`, a.map, 'https://maps.app.goo.gl/…')}</label>
        <label>Telefon domaćina (WhatsApp)${plain(`apartments.${i}.phone`, a.phone, '+385 9…')}</label>
        <label>Wi-Fi mreža${plain(`apartments.${i}.wifi_ssid`, a.wifi_ssid)}</label>
        <label>Wi-Fi lozinka${plain(`apartments.${i}.wifi_pass`, a.wifi_pass)}</label>
        <label>Check-in od${plain(`apartments.${i}.checkin`, a.checkin, '14:00')}</label>
        <label>Check-out do${plain(`apartments.${i}.checkout`, a.checkout, '10:00')}</label>
      </div>
      <h3 style="margin-top:14px">Upute za goste</h3>${itemsEditor(`apartments.${i}.items`, a.items)}
    </div>`).join('');
  h += `</div><div class="row"><button class="btn ghost" onclick="addApt()">＋ Dodaj apartman</button></div>${saveBar('saveApts')}`;
  return h;
}
function addApt() {
  D.apartments.push({ id: 'a' + Date.now().toString(36), name: '', address: '', map: '', wifi_ssid: '', wifi_pass: '', checkin: '14:00', checkout: '10:00', phone: '', items: [] });
  dirty = true; render();
}
function removeApt(i) {
  const a = D.apartments[i];
  if (D.stays.some(s => s.apt === a.id && s.departure >= today())) return toast('Apartman ima aktivne boravke.');
  if (!confirm('Ukloniti apartman ' + (a.name || '') + '?')) return;
  D.apartments.splice(i, 1); dirty = true; render();
}
async function saveApts() {
  if (D.apartments.some(a => !a.name.trim())) return toast('Svaki apartman treba naziv.');
  try { await api('apartments', { method: 'POST', body: D.apartments }); toast('Spremljeno ✓'); await reload(); } catch {}
}

// ---------- content ----------
function contentTab() {
  let h = `<h2>Sadržaj za goste</h2><p class="muted">Mjesto, otok, plaže, restorani i korisne informacije – isto za sve apartmane.</p>${langBar()}<div oninput="onEdit(event)">`;
  h += D.content.sections.map((s, i) => `<div class="card"><div class="tools row" style="justify-content:flex-end;margin:0">
      <button class="btn sm ghost" onclick="move('content.sections',${i},-1)">↑</button><button class="btn sm ghost" onclick="move('content.sections',${i},1)">↓</button>
      <button class="btn sm danger" onclick="removeAt('content.sections',${i})">Ukloni cjelinu</button></div>
      <div class="grid" style="grid-template-columns: 80px 1fr"><label>Ikona${plain(`content.sections.${i}.icon`, s.icon, '🏖')}</label>
      <label>Naziv cjeline (${LANGS[editLang]})${ml(`content.sections.${i}.title`, s.title)}</label></div>
      ${itemsEditor(`content.sections.${i}.items`, s.items)}</div>`).join('');
  h += `</div><div class="row"><button class="btn ghost" onclick="addSection()">＋ Dodaj cjelinu</button></div>${saveBar('saveContent')}`;
  return h;
}
function addSection() { D.content.sections.push({ id: 's' + Date.now().toString(36), icon: '📌', title: {}, items: [] }); dirty = true; render(); }
async function saveContent() {
  try { await api('content', { method: 'POST', body: D.content }); toast('Spremljeno ✓'); await reload(); } catch {}
}

// ---------- settings ----------
function settingsTab() {
  return `<h2>Postavke</h2><div class="card" oninput="onEdit(event)"><h3>Domaćin</h3>
    <p class="muted small">Ime i kontakt prikazuju se gostima u obavijesti o zaštiti podataka (voditelj obrade) i kao kontakt ako apartman nema svoj telefon.</p>
    <div class="grid"><label>Ime i prezime / tvrtka${plain('host.name', D.host.name)}</label>
    <label>Telefon${plain('host.phone', D.host.phone, '+385 9…')}</label>
    <label>E-mail${plain('host.email', D.host.email)}</label></div>
    <div class="row"><button class="btn" onclick="saveHost()">💾 Spremi</button></div></div>
    <div class="card"><h3>Kako radi</h3><ol class="muted" style="padding-left:18px;margin:0">
      <li>U „Boravci" napravite link za rezervaciju i pošaljite ga gostu (WhatsApp, SMS, e-mail).</li>
      <li>Gost na linku vidi upute za apartman i Lošinj te upiše podatke iz putovnice za sve osobe.</li>
      <li>Kod boravka se pojavi „Prijavljeno – upiši u eVisitor": otvorite podatke i prepišite ih u eVisitor (dodir kopira podatak).</li>
      <li>Označite „✓ Upisano u eVisitor". Podaci s putovnica brišu se automatski ${D.keep_days} dana nakon slanja (ili odmah gumbom), a u evidenciji ostaju prezime i datumi.</li>
    </ol></div>`;
}
async function saveHost() {
  try { await api('host', { method: 'POST', body: D.host }); toast('Spremljeno ✓'); await reload(); } catch {}
}

window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
if (pin) reload(); else showLogin();
</script>
