<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b5d7a">
<title>Welcome</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f2ea; --card: #ffffff; --fg: #1d2a33; --muted: #5d6b75; --line: #e4ddd0;
    --sea: #0b5d7a; --sea2: #13839f; --sand: #e9c46a; --ok: #2a7d4f; --okbg: #e3f3e9; --warn: #b5541c; --warnbg: #fdeee2; --err: #b3261e;
    --input: #fbf9f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a21; --card: #17252e; --fg: #e8eef2; --muted: #9aabb6; --line: #2a3b46;
      --sea: #4fb3cf; --sea2: #7ccbe0; --ok: #6fd39a; --okbg: #163326; --warn: #f2a46b; --warnbg: #3a2416; --err: #ff8a80; --input: #12202a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  a { color: var(--sea); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

  header.hero { background: linear-gradient(160deg, #0b5d7a 0%, #13839f 55%, #5fb7c9 100%); color: #fff; padding: 20px 0 28px; }
  .hero .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hero .brand { font-weight: 600; opacity: .9; font-size: .95rem; }
  .hero h1 { font-size: 1.75rem; line-height: 1.2; margin: 18px 0 4px; }
  .hero .dates { opacity: .95; }
  .hero .brand { flex: 1; min-width: 0; }
  .lang { flex: none; width: auto; margin: 0; min-height: 0; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 999px; padding: 4px 10px; }
  .lang option { color: #1d2a33; }

  nav.chips { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav.chips .wrap { display: flex; gap: 6px; overflow-x: auto; padding-top: 8px; padding-bottom: 8px; scrollbar-width: none; }
  nav.chips a { flex: none; text-decoration: none; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: .9rem; white-space: nowrap; }
  nav.chips a.reg { border-color: var(--warn); color: var(--warn); font-weight: 600; }
  nav.chips a.reg.done { border-color: var(--ok); color: var(--ok); }

  section { padding: 18px 0 4px; scroll-margin-top: 56px; }
  h2 { font-size: 1.25rem; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .card p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
  .card img { width: 100%; border-radius: 10px; margin-bottom: 10px; display: block; max-height: 260px; object-fit: cover; }
  .card .more { display: inline-block; margin-top: 8px; font-weight: 600; text-decoration: none; }
  .muted { color: var(--muted); }

  .notice { border-radius: 14px; padding: 14px 16px; margin: -14px 0 6px; position: relative; z-index: 1; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .notice.todo { background: var(--warnbg); border: 1px solid var(--warn); }
  .notice.done { background: var(--okbg); border: 1px solid var(--ok); }
  .notice b { display: block; margin-bottom: 2px; }
  .notice .btn { margin-top: 10px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .kv:first-of-type { border-top: 0; }
  .kv .v { font-weight: 600; overflow-wrap: anywhere; }
  .big { font-size: 1.15rem; font-weight: 700; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--sea); color: #fff; font-weight: 600; text-decoration: none; cursor: pointer; min-height: 44px; }
  @media (prefers-color-scheme: dark) { .btn { color: #0f1a21; } }
  .btn.ghost { background: transparent; color: var(--sea); border: 1px solid var(--sea); }
  .btn.small { min-height: 34px; padding: 4px 12px; font-size: .9rem; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  details.card { padding: 0; }
  details.card summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "＋"; color: var(--muted); }
  details.card[open] summary::after { content: "－"; }
  details.card .body { padding: 0 16px 14px; }

  form .guest { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  form .guest .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  form .guest .head b { font-size: 1.05rem; }
  label { display: block; margin-top: 10px; font-size: .9rem; color: var(--muted); }
  label .req { color: var(--warn); }
  input[type=text], input[type=date], input[type=time], select { width: 100%; margin-top: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--input); min-height: 44px; }
  input.bad, select.bad { border-color: var(--err); outline: 1px solid var(--err); }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .seg label { margin: 0; flex: 1 1 120px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--input); color: var(--fg); cursor: pointer; }
  .seg label.on { border-color: var(--sea); outline: 1px solid var(--sea); }
  .seg.bad label { border-color: var(--err); }
  .seg input { accent-color: var(--sea); }
  .privacy { font-size: .9rem; color: var(--muted); }
  .check { display: flex; gap: 10px; align-items: flex-start; color: var(--fg); font-size: .95rem; }
  .check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--sea); flex: none; }
  .msg { margin-top: 10px; font-weight: 600; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .center { text-align: center; padding: 60px 16px; }
  footer { padding: 30px 0 40px; text-align: center; color: var(--muted); font-size: .85rem; }
  @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"><div class="center muted">…</div></div>

<script>
const TOKEN = location.pathname.split('/')[2];
const LANGS = { hr: 'Hrvatski', en: 'English', de: 'Deutsch', it: 'Italiano' };
const T = {
  welcome: { hr: 'Dobrodošli', en: 'Welcome', de: 'Willkommen', it: 'Benvenuti' },
  apartment: { hr: 'Apartman', en: 'Apartment', de: 'Ferienwohnung', it: 'Appartamento' },
  network: { hr: 'Mreža', en: 'Network', de: 'Netzwerk', it: 'Rete' },
  password: { hr: 'Lozinka', en: 'Password', de: 'Passwort', it: 'Password' },
  copy: { hr: 'Kopiraj', en: 'Copy', de: 'Kopieren', it: 'Copia' },
  copied: { hr: 'Kopirano ✓', en: 'Copied ✓', de: 'Kopiert ✓', it: 'Copiato ✓' },
  checkin: { hr: 'Dolazak od', en: 'Check-in from', de: 'Check-in ab', it: 'Check-in dalle' },
  checkout: { hr: 'Odlazak do', en: 'Check-out by', de: 'Check-out bis', it: 'Check-out entro le' },
  address: { hr: 'Adresa', en: 'Address', de: 'Adresse', it: 'Indirizzo' },
  map: { hr: 'Otvori kartu', en: 'Open map', de: 'Karte öffnen', it: 'Apri mappa' },
  host: { hr: 'Vaš domaćin', en: 'Your host', de: 'Ihr Gastgeber', it: 'Il vostro host' },
  call: { hr: 'Nazovi', en: 'Call', de: 'Anrufen', it: 'Chiama' },
  more: { hr: 'Više informacija', en: 'More info', de: 'Mehr Infos', it: 'Maggiori info' },
  reg: { hr: 'Prijava gostiju', en: 'Guest registration', de: 'Gästeanmeldung', it: 'Registrazione ospiti' },
  reg_todo: {
    hr: 'Prema hrvatskim propisima svakog gosta moramo prijaviti u sustav eVisitor. Molimo upišite podatke iz putovnice ili osobne iskaznice za sve osobe, i za djecu.',
    en: 'Croatian law requires us to register every guest in the eVisitor system. Please enter the details from the passport or ID card of every person, children included.',
    de: 'Nach kroatischem Recht müssen wir jeden Gast im System eVisitor anmelden. Bitte geben Sie die Daten aus dem Reisepass oder Personalausweis aller Personen ein, auch der Kinder.',
    it: 'La legge croata ci obbliga a registrare ogni ospite nel sistema eVisitor. Inserite i dati del passaporto o della carta d\'identità di tutte le persone, bambini compresi.' },
  reg_btn: { hr: 'Ispuni prijavu', en: 'Fill in the registration', de: 'Anmeldung ausfüllen', it: 'Compila la registrazione' },
  reg_done: { hr: 'Prijava je poslana ✓', en: 'Registration sent ✓', de: 'Anmeldung gesendet ✓', it: 'Registrazione inviata ✓' },
  reg_done_txt: { hr: 'Hvala! Prijavljeno gostiju: {n}.', en: 'Thank you! Guests registered: {n}.', de: 'Danke! Angemeldete Gäste: {n}.', it: 'Grazie! Ospiti registrati: {n}.' },
  reg_edit: { hr: 'Ispravi ili dodaj gosta', en: 'Correct or add a guest', de: 'Korrigieren oder Gast hinzufügen', it: 'Correggi o aggiungi un ospite' },
  reg_locked: { hr: 'Prijava je obrađena. Za izmjene se javite domaćinu.', en: 'Your registration has been processed. Please contact your host for any changes.', de: 'Ihre Anmeldung wurde bearbeitet. Für Änderungen wenden Sie sich bitte an Ihren Gastgeber.', it: 'La registrazione è stata elaborata. Per modifiche contattate il vostro host.' },
  guest_n: { hr: 'Gost {n}', en: 'Guest {n}', de: 'Gast {n}', it: 'Ospite {n}' },
  first: { hr: 'Ime', en: 'First name(s)', de: 'Vorname(n)', it: 'Nome' },
  last: { hr: 'Prezime', en: 'Surname', de: 'Nachname', it: 'Cognome' },
  sex: { hr: 'Spol', en: 'Sex', de: 'Geschlecht', it: 'Sesso' },
  M: { hr: 'Muški', en: 'Male', de: 'Männlich', it: 'Maschile' },
  F: { hr: 'Ženski', en: 'Female', de: 'Weiblich', it: 'Femminile' },
  dob: { hr: 'Datum rođenja', en: 'Date of birth', de: 'Geburtsdatum', it: 'Data di nascita' },
  birth_country: { hr: 'Država rođenja', en: 'Country of birth', de: 'Geburtsland', it: 'Paese di nascita' },
  birth_city: { hr: 'Mjesto rođenja', en: 'Place of birth', de: 'Geburtsort', it: 'Luogo di nascita' },
  citizenship: { hr: 'Državljanstvo', en: 'Nationality', de: 'Staatsangehörigkeit', it: 'Cittadinanza' },
  res_country: { hr: 'Država prebivališta', en: 'Country of residence', de: 'Wohnsitzland', it: 'Paese di residenza' },
  res_city: { hr: 'Mjesto prebivališta', en: 'City of residence', de: 'Wohnort', it: 'Città di residenza' },
  doc_type: { hr: 'Vrsta isprave', en: 'Document type', de: 'Ausweisart', it: 'Tipo di documento' },
  passport: { hr: 'Putovnica', en: 'Passport', de: 'Reisepass', it: 'Passaporto' },
  id: { hr: 'Osobna iskaznica', en: 'ID card', de: 'Personalausweis', it: 'Carta d\'identità' },
  other: { hr: 'Drugo', en: 'Other', de: 'Andere', it: 'Altro' },
  doc_number: { hr: 'Broj isprave', en: 'Document number', de: 'Ausweisnummer', it: 'Numero del documento' },
  optional: { hr: 'neobavezno', en: 'optional', de: 'optional', it: 'facoltativo' },
  choose: { hr: 'Odaberite…', en: 'Choose…', de: 'Bitte wählen…', it: 'Scegliete…' },
  same_all: { hr: 'Kopiraj adresu od gosta 1', en: 'Same address as guest 1', de: 'Gleiche Adresse wie Gast 1', it: 'Stesso indirizzo dell\'ospite 1' },
  add_guest: { hr: '＋ Dodaj gosta', en: '＋ Add guest', de: '＋ Gast hinzufügen', it: '＋ Aggiungi ospite' },
  remove: { hr: 'Ukloni', en: 'Remove', de: 'Entfernen', it: 'Rimuovi' },
  arrival_time: { hr: 'Približno vrijeme dolaska', en: 'Approximate arrival time', de: 'Ungefähre Ankunftszeit', it: 'Orario di arrivo previsto' },
  privacy_title: { hr: 'Zaštita podataka', en: 'Privacy', de: 'Datenschutz', it: 'Privacy' },
  privacy: {
    hr: 'Podatke koristimo samo za prijavu boravka u sustav eVisitor, kako propisuje hrvatski zakon. Čuvamo ih zaštićeno najviše {days} dana, a zatim se automatski trajno brišu; ostaju samo prezime i datumi boravka. Podatke ne dajemo nikome osim nadležnim tijelima putem eVisitora.',
    en: 'We use these details only to register your stay in the eVisitor system, as required by Croatian law. They are stored securely for at most {days} days and then permanently deleted automatically; only the surname and the dates of the stay are kept. We share them with no one except the authorities through eVisitor.',
    de: 'Wir verwenden diese Daten nur zur Anmeldung Ihres Aufenthalts im System eVisitor, wie es das kroatische Gesetz vorschreibt. Sie werden höchstens {days} Tage sicher gespeichert und danach automatisch dauerhaft gelöscht; nur Nachname und Aufenthaltsdaten bleiben. Wir geben sie an niemanden weiter außer über eVisitor an die zuständigen Behörden.',
    it: 'Usiamo questi dati solo per registrare il vostro soggiorno nel sistema eVisitor, come previsto dalla legge croata. Sono conservati in modo sicuro per al massimo {days} giorni e poi cancellati automaticamente in modo definitivo; restano solo il cognome e le date del soggiorno. Non li comunichiamo a nessuno tranne alle autorità tramite eVisitor.' },
  controller: { hr: 'Voditelj obrade', en: 'Data controller', de: 'Verantwortlicher', it: 'Titolare del trattamento' },
  confirm: { hr: 'Potvrđujem da su podaci točni i da sam pročitao/la obavijest o zaštiti podataka.', en: 'I confirm the details are correct and I have read the privacy notice.', de: 'Ich bestätige, dass die Angaben korrekt sind, und habe den Datenschutzhinweis gelesen.', it: 'Confermo che i dati sono corretti e di aver letto l\'informativa sulla privacy.' },
  send: { hr: 'Pošalji prijavu', en: 'Send registration', de: 'Anmeldung senden', it: 'Invia registrazione' },
  sending: { hr: 'Šaljem…', en: 'Sending…', de: 'Wird gesendet…', it: 'Invio…' },
  err_fields: { hr: 'Provjerite označena polja.', en: 'Please check the highlighted fields.', de: 'Bitte prüfen Sie die markierten Felder.', it: 'Controllate i campi evidenziati.' },
  err_confirm: { hr: 'Molimo potvrdite točnost podataka.', en: 'Please confirm the details are correct.', de: 'Bitte bestätigen Sie die Richtigkeit der Angaben.', it: 'Confermate che i dati sono corretti.' },
  err_net: { hr: 'Slanje nije uspjelo. Provjerite internet i pokušajte ponovno.', en: 'Sending failed. Check your connection and try again.', de: 'Senden fehlgeschlagen. Prüfen Sie die Verbindung und versuchen Sie es erneut.', it: 'Invio non riuscito. Controllate la connessione e riprovate.' },
  err_many: { hr: 'Previše pokušaja. Pokušajte kasnije.', en: 'Too many attempts. Please try later.', de: 'Zu viele Versuche. Bitte später erneut versuchen.', it: 'Troppi tentativi. Riprovate più tardi.' },
  not_found: { hr: 'Link nije valjan ili je istekao. Molimo javite se domaćinu.', en: 'This link is not valid or has expired. Please contact your host.', de: 'Dieser Link ist ungültig oder abgelaufen. Bitte wenden Sie sich an Ihren Gastgeber.', it: 'Il link non è valido o è scaduto. Contattate il vostro host.' },
  load_err: { hr: 'Stranica se nije učitala. Provjerite internet.', en: 'The page could not load. Check your connection.', de: 'Die Seite konnte nicht geladen werden. Prüfen Sie die Verbindung.', it: 'Impossibile caricare la pagina. Controllate la connessione.' },
  retry: { hr: 'Pokušaj ponovno', en: 'Try again', de: 'Erneut versuchen', it: 'Riprova' },
  enjoy: { hr: 'Ugodan boravak na Lošinju!', en: 'Enjoy your stay on Lošinj!', de: 'Schönen Aufenthalt auf Lošinj!', it: 'Buon soggiorno a Lošinj!' },
};
// Most frequent guests first in the country lists
const TOP = ['HR', 'DE', 'AT', 'IT', 'SI', 'CZ', 'SK', 'HU', 'PL', 'NL', 'CH', 'GB', 'FR', 'BA', 'RS'];
const ISO = 'AD AE AF AG AI AL AM AO AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GT GU GW GY HK HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VG VI VN VU WF WS XK YE YT ZA ZM ZW'.split(' ');

let lang = 'en', data = null, guests = [], arrivalTime = '', editing = false;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const t = (k, vars) => { let s = (T[k] && (T[k][lang] || T[k].en)) || k; for (const v in vars || {}) s = s.replace('{' + v + '}', vars[v]); return s; };
const tx = o => (o && (o[lang] || o.en || o.hr || Object.values(o)[0])) || '';
// Plain text with clickable links and phone numbers
const rich = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const fmtDay = d => new Date(d + 'T12:00:00Z').toLocaleDateString(lang === 'hr' ? 'hr-HR' : lang, { day: 'numeric', month: 'long', timeZone: 'UTC' });
const linkAttrs = url => /^https?:/i.test(url) ? ' target="_blank" rel="noopener noreferrer"' : '';
const telHref = p => 'tel:' + String(p).replace(/[^\d+]/g, '');
const waHref = p => 'https://wa.me/' + String(p).replace(/[^\d]/g, '').replace(/^00/, '');

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const DRAFT = 'draft:' + TOKEN;

let countryCache = {};
function countryOptions(sel) {
  if (!countryCache[lang]) {
    let dn = null;
    try { dn = new Intl.DisplayNames([lang], { type: 'region' }); } catch {}
    const name = c => (dn && dn.of(c)) || c;
    const rest = ISO.filter(c => !TOP.includes(c)).map(c => [c, name(c)]).sort((a, b) => a[1].localeCompare(b[1], lang));
    countryCache[lang] = { top: TOP.map(c => [c, name(c)]), rest };
  }
  const o = ([c, n]) => `<option value="${c}"${c === sel ? ' selected' : ''}>${esc(n)}</option>`;
  const { top, rest } = countryCache[lang];
  return `<option value="">${esc(t('choose'))}</option>${top.map(o).join('')}<option disabled>──────────</option>${rest.map(o).join('')}`;
}

async function load() {
  try {
    const r = await fetch('/api/g/' + encodeURIComponent(TOKEN), { cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      pickLang(null);
      app.innerHTML = `<div class="center"><p class="big">🌊</p><p>${esc(t(r.status === 404 ? 'not_found' : r.status === 429 ? 'err_many' : 'load_err'))}</p></div>`;
      return;
    }
    data = d;
    pickLang(d.stay.lang);
    if (d.stay.locked) store.del(DRAFT);
    const draft = store.get(DRAFT);
    guests = draft?.guests?.length ? draft.guests : [];
    arrivalTime = draft?.arrival_time || d.stay.arrival_time || '';
    while (guests.length < (d.stay.sent ? 1 : d.stay.expected)) guests.push(blankGuest());
    render();
  } catch {
    pickLang(null);
    app.innerHTML = `<div class="center"><p>${esc(t('load_err'))}</p><button class="btn" onclick="load()">${esc(t('retry'))}</button></div>`;
  }
}

function pickLang(stayLang) {
  const saved = store.get('lang');
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  lang = [saved, stayLang, nav].find(l => l && LANGS[l]) || 'en';
  document.documentElement.lang = lang;
}

function blankGuest() {
  return { first: '', last: '', sex: '', dob: '', birth_country: '', birth_city: '', citizenship: '', res_country: '', res_city: '', doc_type: 'passport', doc_number: '' };
}

function render() {
  const { stay, apartment: a, content, host } = data;
  document.title = a.name;
  const sent = stay.sent && !editing;
  const regState = stay.locked || sent ? 'done' : 'todo';
  const sections = content.sections.filter(s => s.items.length);

  let h = `<header class="hero"><div class="wrap">
    <div class="top"><span class="brand">🌊 ${esc(a.name)}</span>
      <select class="lang" aria-label="Language" onchange="setLang(this.value)">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}"${k === lang ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
    <h1>${esc(t('welcome'))}!</h1>
    <div class="dates">${esc(fmtDay(stay.arrival))} – ${esc(fmtDay(stay.departure))}</div>
  </div></header>`;

  h += `<div class="wrap">${regNotice(stay, regState)}</div>`;

  h += `<nav class="chips"><div class="wrap">
    <a href="#apt">🏠 ${esc(t('apartment'))}</a>
    ${sections.map(s => `<a href="#s-${esc(s.id)}">${esc(s.icon)} ${esc(tx(s.title))}</a>`).join('')}
    <a href="#reg" class="reg ${regState === 'done' ? 'done' : ''}">${regState === 'done' ? '✓' : '✍️'} ${esc(t('reg'))}</a>
  </div></nav>`;

  h += '<main class="wrap">';
  h += `<section id="apt"><h2>🏠 ${esc(a.name)}</h2>`;
  if (a.wifi_ssid || a.wifi_pass) {
    h += `<div class="card"><h3>📶 Wi-Fi</h3>
      ${a.wifi_ssid ? `<div class="kv"><span class="muted">${esc(t('network'))}</span><span class="v">${esc(a.wifi_ssid)}</span></div>` : ''}
      ${a.wifi_pass ? `<div class="kv"><span class="muted">${esc(t('password'))}</span><span class="v big">${esc(a.wifi_pass)}</span></div>
        <div class="row"><button class="btn small ghost" onclick="copyText(this, ${esc(JSON.stringify(a.wifi_pass))})">${esc(t('copy'))}</button></div>` : ''}
    </div>`;
  }
  if (a.checkin || a.checkout) {
    h += `<div class="grid2">
      ${a.checkin ? `<div class="card"><div class="muted">${esc(t('checkin'))}</div><div class="big">${esc(a.checkin)}</div></div>` : ''}
      ${a.checkout ? `<div class="card"><div class="muted">${esc(t('checkout'))}</div><div class="big">${esc(a.checkout)}</div></div>` : ''}
    </div>`;
  }
  if (a.address) {
    const map = a.map || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a.address);
    h += `<div class="card"><div class="muted">${esc(t('address'))}</div><div class="v">${esc(a.address)}</div>
      <div class="row"><a class="btn small ghost" href="${esc(map)}" target="_blank" rel="noopener noreferrer">📍 ${esc(t('map'))}</a></div></div>`;
  }
  const phone = a.phone || host.phone;
  if (phone) {
    h += `<div class="card"><div class="muted">${esc(t('host'))}</div><div class="v">${esc(host.name || '')} ${esc(phone)}</div>
      <div class="row"><a class="btn small" href="${esc(telHref(phone))}">📞 ${esc(t('call'))}</a>
      <a class="btn small ghost" href="${esc(waHref(phone))}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a></div></div>`;
  }
  h += (a.items || []).map(item => itemHtml(item, true)).join('');
  h += '</section>';

  for (const s of sections) {
    h += `<section id="s-${esc(s.id)}"><h2>${esc(s.icon)} ${esc(tx(s.title))}</h2>${s.items.map(i => itemHtml(i, false)).join('')}</section>`;
  }

  h += `<section id="reg"><h2>✍️ ${esc(t('reg'))}</h2>${regBody(stay, host)}</section>`;
  h += `</main><footer>${esc(t('enjoy'))}</footer>`;
  app.innerHTML = h;
}

function itemHtml(i, collapsible) {
  const title = tx(i.title), text = tx(i.text);
  const inner = `${i.img ? `<img src="${esc(i.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}
    ${text ? `<p>${rich(text)}</p>` : ''}
    ${i.link ? `<a class="more" href="${esc(i.link)}"${linkAttrs(i.link)}>${esc(t('more'))} →</a>` : ''}`;
  if (collapsible) return `<details class="card"><summary>${esc(title)}</summary><div class="body">${inner}</div></details>`;
  return `<div class="card">${title ? `<h3>${esc(title)}</h3>` : ''}${inner}</div>`;
}

function regNotice(stay, state) {
  if (state === 'done') {
    return `<div class="notice done"><b>${esc(t('reg_done'))}</b>${esc(t('reg_done_txt', { n: stay.n_guests }))}</div>`;
  }
  return `<div class="notice todo"><b>✍️ ${esc(t('reg'))}</b>${esc(t('reg_todo'))}
    <div><a class="btn" href="#reg">${esc(t('reg_btn'))}</a></div></div>`;
}

function regBody(stay, host) {
  if (stay.locked) {
    return `<div class="card"><p>${esc(t('reg_done_txt', { n: stay.n_guests }))}</p>
      ${stay.names.length ? `<p class="muted">${stay.names.map(esc).join('<br>')}</p>` : ''}<p class="muted">${esc(t('reg_locked'))}</p></div>`;
  }
  if (stay.sent && !editing) {
    return `<div class="card"><p class="msg ok">${esc(t('reg_done'))}</p>
      <p class="muted">${stay.names.map(esc).join('<br>')}</p>
      <div class="row"><button class="btn ghost" onclick="startEdit()">${esc(t('reg_edit'))}</button></div></div>`;
  }
  let h = `<p class="muted">${esc(t('reg_todo'))}</p><form id="regform" novalidate onsubmit="return send(event)" oninput="saveDraft(event)" onchange="saveDraft(event)">`;
  guests.forEach((g, i) => { h += guestHtml(g, i); });
  h += `<div class="row" style="margin:0 0 14px"><button type="button" class="btn ghost" onclick="addGuest()" ${guests.length >= 12 ? 'disabled' : ''}>${esc(t('add_guest'))}</button></div>`;
  h += `<div class="card"><label>${esc(t('arrival_time'))} <span class="muted">(${esc(t('optional'))})</span>
      <input type="time" name="arrival_time" value="${esc(arrivalTime)}"></label></div>`;
  h += `<div class="card"><h3>🔒 ${esc(t('privacy_title'))}</h3><p class="privacy">${esc(t('privacy', { days: data.keep_days || 7 }))}</p>
    ${host.name ? `<p class="privacy">${esc(t('controller'))}: ${esc(host.name)}${host.email ? ', ' + esc(host.email) : ''}${host.phone ? ', ' + esc(host.phone) : ''}</p>` : ''}
    <label class="check"><input type="checkbox" id="confirm"> <span>${esc(t('confirm'))}</span></label>
    <div class="row"><button class="btn" id="sendbtn" type="submit" style="width:100%">${esc(t('send'))}</button></div>
    <div class="msg err" id="formmsg" role="alert"></div></div>`;
  h += '</form>';
  return h;
}

function guestHtml(g, i) {
  const req = '<span class="req">*</span>';
  const f = (k, extra = '') => `<label>${esc(t(k))} ${req}<input type="text" name="${k}" data-i="${i}" value="${esc(g[k])}" ${extra}></label>`;
  const seg = (k, opts) => `<label>${esc(t(k))} ${req}</label><div class="seg" data-seg="${k}-${i}">${opts.map(o =>
    `<label class="${g[k] === o ? 'on' : ''}"><input type="radio" name="${k}-${i}" data-i="${i}" data-k="${k}" value="${o}"${g[k] === o ? ' checked' : ''}> ${esc(t(o))}</label>`).join('')}</div>`;
  const sel = k => `<label>${esc(t(k))} ${req}<select name="${k}" data-i="${i}">${countryOptions(g[k])}</select></label>`;
  return `<div class="guest" data-guest="${i}">
    <div class="head"><b>${esc(t('guest_n', { n: i + 1 }))}</b>${guests.length > 1 ? `<button type="button" class="btn small ghost" onclick="removeGuest(${i})">${esc(t('remove'))}</button>` : ''}</div>
    <div class="grid2">${f('first', 'autocomplete="given-name"')}${f('last', 'autocomplete="family-name"')}</div>
    ${seg('sex', ['M', 'F'])}
    <label>${esc(t('dob'))} ${req}<input type="date" name="dob" data-i="${i}" value="${esc(g.dob)}" max="${new Date().toISOString().slice(0, 10)}" min="1900-01-01"></label>
    ${sel('citizenship')}
    <div class="grid2">${sel('birth_country')}<label>${esc(t('birth_city'))} <span class="muted">(${esc(t('optional'))})</span><input type="text" name="birth_city" data-i="${i}" value="${esc(g.birth_city)}"></label></div>
    <div class="grid2">${sel('res_country')}${f('res_city')}</div>
    ${i > 0 ? `<div class="row" style="margin-top:6px"><button type="button" class="btn small ghost" onclick="sameAddress(${i})">${esc(t('same_all'))}</button></div>` : ''}
    ${seg('doc_type', ['passport', 'id', 'other'])}
    ${f('doc_number', 'autocapitalize="characters" autocomplete="off" spellcheck="false"')}
  </div>`;
}

function readForm() {
  const form = document.getElementById('regform');
  if (!form) return;
  form.querySelectorAll('[data-i]').forEach(el => {
    const g = guests[+el.dataset.i];
    if (!g) return;
    if (el.type === 'radio') { if (el.checked) g[el.dataset.k] = el.value; }
    else g[el.name] = el.value;
  });
  const at = form.querySelector('[name=arrival_time]');
  if (at) arrivalTime = at.value;
}

function saveDraft(e) {
  readForm();
  if (e && e.target && e.target.type === 'radio') {
    const box = e.target.closest('.seg');
    box.classList.remove('bad');
    box.querySelectorAll('label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
  }
  if (e && e.target) e.target.classList.remove('bad');
  // The draft stays only on this phone, so the form can be corrected later without retyping
  store.set(DRAFT, { guests, arrival_time: arrivalTime });
}

function addGuest() { readForm(); guests.push(blankGuest()); saveDraft(); render(); location.hash = ''; document.querySelector(`[data-guest="${guests.length - 1}"]`)?.scrollIntoView({ behavior: 'smooth' }); }
function removeGuest(i) { readForm(); guests.splice(i, 1); saveDraft(); render(); document.getElementById('reg').scrollIntoView(); }
function sameAddress(i) { readForm(); guests[i].res_country = guests[0].res_country; guests[i].res_city = guests[0].res_city; saveDraft(); render(); document.querySelector(`[data-guest="${i}"]`)?.scrollIntoView(); }
function startEdit() { editing = true; if (!guests.some(g => g.first)) guests = [blankGuest()]; render(); document.getElementById('reg').scrollIntoView(); }
function setLang(l) { readForm(); lang = l; store.set('lang', l); document.documentElement.lang = l; render(); }

function check() {
  let ok = true;
  const today = new Date().toISOString().slice(0, 10);
  guests.forEach((g, i) => {
    const bad = (name, cond) => {
      const el = document.querySelector(`[data-guest="${i}"] [name="${name}"]`) || document.querySelector(`[data-seg="${name}-${i}"]`);
      if (cond) { ok = false; el?.classList.add('bad'); }
    };
    bad('first', !g.first.trim()); bad('last', !g.last.trim());
    bad('sex', !g.sex); bad('doc_type', !g.doc_type);
    bad('dob', !/^\d{4}-\d{2}-\d{2}$/.test(g.dob) || g.dob > today || g.dob < '1900-01-01');
    bad('citizenship', !g.citizenship); bad('birth_country', !g.birth_country); bad('res_country', !g.res_country);
    bad('res_city', !g.res_city.trim());
    bad('doc_number', !/^[A-Z0-9][A-Z0-9 -]{2,19}$/.test(g.doc_number.trim().toUpperCase()));
  });
  return ok;
}

async function send(e) {
  e.preventDefault();
  readForm();
  const msg = document.getElementById('formmsg');
  msg.textContent = '';
  if (!check()) { msg.textContent = t('err_fields'); document.querySelector('.bad')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; }
  if (!document.getElementById('confirm').checked) { msg.textContent = t('err_confirm'); return false; }
  const btn = document.getElementById('sendbtn');
  btn.disabled = true; btn.textContent = t('sending');
  try {
    const r = await fetch('/api/g/' + encodeURIComponent(TOKEN) + '/guests', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guests: guests.map(g => ({ ...g, doc_number: g.doc_number.trim().toUpperCase() })), arrival_time: arrivalTime }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      msg.textContent = t(d.error === 'invalid' ? 'err_fields' : d.error === 'too_many' ? 'err_many' : d.error === 'locked' ? 'reg_locked' : 'err_net');
      btn.disabled = false; btn.textContent = t('send');
      return false;
    }
    editing = false;
    data.stay.sent = true;
    data.stay.n_guests = guests.length;
    data.stay.names = guests.map(g => `${g.first} ${g.last}`);
    render();
    document.getElementById('reg').scrollIntoView({ behavior: 'smooth' });
  } catch {
    msg.textContent = t('err_net');
    btn.disabled = false; btn.textContent = t('send');
  }
  return false;
}

async function copyText(btn, text) {
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  const old = btn.textContent; btn.textContent = t('copied'); setTimeout(() => { btn.textContent = old; }, 1500);
}

load();
</script>
</body>
</html>
